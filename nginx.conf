# =========================================================
# KRMU Vault — Production Nginx Configuration
# Optimized for 10,000+ Concurrent Students
# =========================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # High-Speed In-Memory Open File Cache
    open_file_cache max=50000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS and Crawl Spike Defense)
    limit_req_zone $binary_remote_addr zone=krmu_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=krmu_conn:10m;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Rate Limiting & Connection Pooling
        limit_req zone=krmu_limit burst=100 nodelay;
        limit_conn krmu_conn 50;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;

        # Immutable Cache for Hashed Bundles (1 Year)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # SVG / Favicon / Logo Cache
        location ~* \.(svg|png|jpg|jpeg|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # SPA Routing: Fallback all client routes to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Health check endpoint
        location = /health {
            access_log off;
            return 200 '{"status":"healthy","concurrency":"10000+"}';
            add_header Content-Type application/json;
        }
    }
}
