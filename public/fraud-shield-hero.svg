<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shieldGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect width="600" height="480" rx="24" fill="url(#bgGlow)"/>

  <!-- Telemetry Grid Lines -->
  <g opacity="0.35" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="60" y1="80" x2="540" y2="80"/>
    <line x1="60" y1="160" x2="540" y2="160"/>
    <line x1="60" y1="240" x2="540" y2="240"/>
    <line x1="60" y1="320" x2="540" y2="320"/>
    <line x1="60" y1="400" x2="540" y2="400"/>
    <line x1="120" y1="40" x2="120" y2="440"/>
    <line x1="240" y1="40" x2="240" y2="440"/>
    <line x1="360" y1="40" x2="360" y2="440"/>
    <line x1="480" y1="40" x2="480" y2="440"/>
  </g>

  <!-- Base Isometric Platform -->
  <ellipse cx="300" cy="400" rx="220" ry="40" fill="#e2e8f0" opacity="0.6"/>
  <ellipse cx="300" cy="395" rx="180" ry="30" fill="#cbd5e1" opacity="0.4"/>

  <!-- Digital Payment Card (Behind Shield) -->
  <g transform="translate(140, 130) rotate(-6)" filter="url(#cardShadow)">
    <rect width="320" height="195" rx="16" fill="url(#cardGrad)"/>
    <rect width="320" height="195" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Decorative Card Swirls -->
    <path d="M 0,80 Q 160,20 320,70 L 320,195 L 0,195 Z" fill="#3b82f6" opacity="0.15"/>
    <circle cx="280" cy="45" r="30" fill="#6366f1" opacity="0.25"/>

    <!-- EMV Chip -->
    <rect x="32" y="55" width="42" height="34" rx="6" fill="url(#goldChip)"/>
    <path d="M 32,72 L 74,72 M 53,55 L 53,89" stroke="#92400e" stroke-width="1"/>

    <!-- Contactless wave -->
    <path d="M 90,62 A 12 12 0 0 1 90,82 M 97,58 A 18 18 0 0 1 97,86" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Cardholder & Details -->
    <text x="32" y="135" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="2">•••• •••• •••• 4242</text>
    <text x="32" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">VERIFIED SHOPPER</text>
    <text x="210" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">EXP 08/29</text>

    <!-- Mastercard Circles -->
    <circle cx="260" cy="145" r="16" fill="#ef4444" opacity="0.9"/>
    <circle cx="282" cy="145" r="16" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Central Luminous Defense Shield -->
  <g transform="translate(230, 75)" filter="url(#glowFilter)">
    <!-- Outer Shield Gradient -->
    <path d="M 70,0 C 130,0 140,25 140,80 C 140,150 90,205 70,225 C 50,205 0,150 0,80 C 0,25 10,0 70,0 Z" 
          fill="url(#shieldGrad)"/>
    
    <!-- Inner Glassmorphic Shield -->
    <path d="M 70,8 C 122,8 132,30 132,80 C 132,143 88,193 70,212 C 52,193 8,143 8,80 C 8,30 18,8 70,8 Z" 
          fill="url(#shieldGlass)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Dynamic Checkmark / Lock Icon inside Shield -->
    <circle cx="70" cy="95" r="34" fill="#ffffff" opacity="0.95"/>
    <path d="M 56,95 L 66,105 L 86,83" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="70" y="155" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">FRAUDSHIELD</text>
  </g>

  <!-- Floating Floating Telemetry Tag: 0-100 Risk Score -->
  <g transform="translate(60, 220)" filter="url(#cardShadow)">
    <rect width="165" height="65" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#ecfdf5"/>
    <path d="M 23,32 L 27,36 L 34,29" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="50" y="27" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">FRAUD RISK SCORE</text>
    <text x="50" y="48" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">0.0 <tspan font-size="12" fill="#10b981" font-weight="700">LOW RISK</tspan></text>
  </g>

  <!-- Floating Telemetry Tag: 12ms Latency -->
  <g transform="translate(370, 280)" filter="url(#cardShadow)">
    <rect width="175" height="65" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#eff6ff"/>
    <path d="M 28,24 L 28,32 L 34,32" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="27" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">INLINE EVALUATION</text>
    <text x="50" y="48" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">12ms <tspan font-size="11" fill="#3b82f6" font-weight="700">REAL-TIME</tspan></text>
  </g>

  <!-- Floating Telemetry Tag: 3D Secure Protection -->
  <g transform="translate(380, 80)" filter="url(#cardShadow)">
    <rect width="160" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="10" fill="#fdf4ff"/>
    <path d="M 24,20 L 24,28 M 20,24 L 28,24" stroke="#c026d3" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="23" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="700">3DS 2.0 INTERVENTION</text>
    <text x="44" y="38" fill="#9333ea" font-family="sans-serif" font-size="12" font-weight="800">ZERO FRICTION</text>
  </g>
</svg>
