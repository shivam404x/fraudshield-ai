<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Royal Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Green Safe Gradient -->
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Red Intercept Gradient -->
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Soft Card Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base with Subtle Border -->
  <rect x="2" y="2" width="796" height="236" rx="20" fill="url(#bgBanner)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.3" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="20" y1="60" x2="780" y2="60"/>
    <line x1="20" y1="120" x2="780" y2="120"/>
    <line x1="20" y1="180" x2="780" y2="180"/>
    <line x1="250" y1="20" x2="250" y2="220"/>
    <line x1="530" y1="20" x2="530" y2="220"/>
  </g>

  <!-- Connecting Stream Lines -->
  <!-- Left to Center -->
  <path d="M 235 120 L 335 120" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
  <circle cx="285" cy="120" r="3.5" fill="#2563eb"/>

  <!-- Center to Top Right (Safe) -->
  <path d="M 465 105 C 500 105, 520 70, 565 70" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" opacity="0.9"/>
  
  <!-- Center to Bottom Right (Fraud Intercept) -->
  <path d="M 465 135 C 500 135, 520 170, 565 170" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" opacity="0.9"/>

  <!-- ==================== LEFT CARD: CHECKOUT INGESTION ==================== -->
  <g transform="translate(25, 38)" filter="url(#softShadow)">
    <rect width="210" height="164" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <!-- Header of card -->
    <rect width="210" height="34" rx="14" fill="#f8fafc"/>
    <rect y="24" width="210" height="10" fill="#f8fafc"/>
    <line x1="0" y1="34" x2="210" y2="34" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Mini window dots -->
    <circle cx="16" cy="17" r="3" fill="#cbd5e1"/>
    <circle cx="26" cy="17" r="3" fill="#cbd5e1"/>
    <circle cx="36" cy="17" r="3" fill="#cbd5e1"/>
    <text x="50" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">CHECKOUT EVENT</text>

    <!-- Card Body Content -->
    <!-- Amount display -->
    <text x="16" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">ORDER TOTAL</text>
    <text x="16" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">$489.50 <tspan font-size="10" font-weight="600" fill="#64748b">USD</tspan></text>

    <!-- Metadata pills -->
    <g transform="translate(16, 92)">
      <rect width="85" height="20" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="8" y="14" font-family="monospace" font-size="9" font-weight="600" fill="#334155">IP: 194.26.*.*</text>
    </g>
    <g transform="translate(108, 92)">
      <rect width="85" height="20" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="8" y="14" font-family="monospace" font-size="9" font-weight="600" fill="#334155">DEV: Win64</text>
    </g>

    <!-- Ingestion speed tag -->
    <g transform="translate(16, 122)">
      <rect width="177" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#2563eb"/>
      <text x="22" y="17" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">Live Ingest &bull; 0.8ms</text>
    </g>
  </g>

  <!-- ==================== CENTER ENGINE: FRAUDSHIELD ML CORE ==================== -->
  <g transform="translate(330, 30)" filter="url(#softShadow)">
    <rect width="140" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Central Shield Emblem with Glow -->
    <g transform="translate(42, 22)">
      <rect width="56" height="56" rx="16" fill="url(#brandGrad)" filter="url(#badgeShadow)"/>
      <!-- Shield SVG Icon Inside -->
      <path d="M 28 14 L 42 20 L 42 32 C 42 41 35 47 28 50 C 21 47 14 41 14 32 L 14 20 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M 23 31 L 27 35 L 34 27" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Engine Title -->
    <text x="70" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a" letter-spacing="-0.2">AI RISK ENGINE</text>
    <text x="70" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b">Balanced RF &bull; XAI</text>

    <!-- Inference Metric Badges -->
    <g transform="translate(14, 130)">
      <rect width="112" height="18" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="56" y="12" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#1e293b">LATENCY &lt; 15ms</text>
    </g>

    <g transform="translate(14, 152)">
      <rect width="112" height="18" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <text x="56" y="12" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#065f46">PRECISION 100%</text>
    </g>
  </g>

  <!-- ==================== RIGHT TOP CARD: LEGITIMATE SHOPPER PASSED ==================== -->
  <g transform="translate(560, 24)" filter="url(#softShadow)">
    <rect width="215" height="88" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <rect width="6" height="88" rx="3" fill="url(#safeGrad)"/>

    <g transform="translate(18, 16)">
      <circle cx="14" cy="14" r="14" fill="#d1fae5"/>
      <path d="M 9 14 L 13 18 L 19 11" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="36" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">Genuine Shopper</text>
      <text x="36" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#047857">Score: 4/100 &bull; Auto-Approved</text>
      
      <g transform="translate(0, 36)">
        <rect width="180" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.7"/>
        <text x="8" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d">&check; Zero Friction Instant Pass</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT BOTTOM CARD: ATTACK INTERCEPTED ==================== -->
  <g transform="translate(560, 126)" filter="url(#softShadow)">
    <rect width="215" height="88" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
    <rect width="6" height="88" rx="3" fill="url(#blockGrad)"/>

    <g transform="translate(18, 16)">
      <circle cx="14" cy="14" r="14" fill="#fee2e2"/>
      <path d="M 9 9 L 19 19 M 19 9 L 9 19" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      
      <text x="36" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b">Attack Intercepted</text>
      <text x="36" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#b91c1c">Score: 94/100 &bull; Proxy + Burst</text>
      
      <g transform="translate(0, 36)">
        <rect width="180" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="0.7"/>
        <text x="8" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">&times; High Risk Payment Blocked</text>
      </g>
    </g>
  </g>
</svg>
