<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#roseGlow)"/>
  
  <!-- Flow Lines -->
  <path d="M 50,120 L 150,120" stroke="#fda4af" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 210,120 L 350,120" stroke="#fda4af" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Left: Botnet Node -->
  <g transform="translate(30, 80)">
    <rect width="80" height="80" rx="14" fill="#ffffff" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="40" cy="35" r="16" fill="#ffe4e6"/>
    <path d="M 32,35 L 48,35 M 40,27 L 40,43" stroke="#e11d48" stroke-width="2"/>
    <text x="40" y="65" text-anchor="middle" fill="#9f1239" font-family="sans-serif" font-size="10" font-weight="700">BOTNET</text>
  </g>

  <!-- Center: FraudShield Interceptor Barrier -->
  <g transform="translate(150, 60)">
    <rect width="100" height="120" rx="16" fill="#ffffff" stroke="#e11d48" stroke-width="2.5"/>
    <circle cx="50" cy="45" r="22" fill="#fff1f2"/>
    <!-- Shield cross -->
    <path d="M 40,45 L 60,45 M 50,35 L 50,55" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
    <text x="50" y="85" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="800">BLOCKED</text>
    <text x="50" y="100" text-anchor="middle" fill="#e11d48" font-family="sans-serif" font-size="9" font-weight="700">SCORE: 99/100</text>
  </g>

  <!-- Right: Merchant / Store Protected -->
  <g transform="translate(290, 80)">
    <rect width="80" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="40" cy="35" r="16" fill="#f1f5f9"/>
    <!-- Store icon -->
    <path d="M 28,32 L 52,32 L 50,46 L 30,46 Z" fill="#64748b"/>
    <text x="40" y="65" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="10" font-weight="700">MERCHANT</text>
  </g>
</svg>
