<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#emeraldGlow)"/>

  <!-- Flow Lines -->
  <path d="M 50,120 L 150,120" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 210,120 L 350,120" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Left: Verified Customer -->
  <g transform="translate(30, 80)">
    <rect width="80" height="80" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <circle cx="40" cy="35" r="16" fill="#ecfdf5"/>
    <!-- User icon -->
    <circle cx="40" cy="31" r="7" fill="#059669"/>
    <path d="M 28,45 C 28,40 33,39 40,39 C 47,39 52,40 52,45" fill="#059669"/>
    <text x="40" y="65" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="10" font-weight="700">SHOPPER</text>
  </g>

  <!-- Center: Seamless Pass Gate -->
  <g transform="translate(150, 60)">
    <rect width="100" height="120" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="50" cy="45" r="22" fill="#ecfdf5"/>
    <!-- Green Check -->
    <path d="M 40,45 L 47,52 L 60,38" stroke="#10b981" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="50" y="85" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="800">APPROVED</text>
    <text x="50" y="100" text-anchor="middle" fill="#059669" font-family="sans-serif" font-size="9" font-weight="700">0ms FRICTION</text>
  </g>

  <!-- Right: Order Fulfilled -->
  <g transform="translate(290, 80)">
    <rect width="80" height="80" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <circle cx="40" cy="35" r="16" fill="#ecfdf5"/>
    <!-- Cart / Bag -->
    <path d="M 32,32 L 48,32 L 46,46 L 34,46 Z" fill="#059669"/>
    <text x="40" y="65" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="10" font-weight="700">DELIVERED</text>
  </g>
</svg>
