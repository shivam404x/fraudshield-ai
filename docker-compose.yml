version: '3.8'

services:
  krmu-vault:
    build: .
    container_name: krmu-vault-app
    restart: always
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
